name: Update README stats cards

on:
  # every day at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-stats.yml
  # on demand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    env:
      # README_STATS_TOKEN is an optional PAT (repo + read:user scopes) to include private stats
      TOKEN: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&theme=solarized-light
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=solarized-light&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
